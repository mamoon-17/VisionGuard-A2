name: Public API from another network
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cloud-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests Pillow
      - run: python scripts/cloud_smoke.py
        env:
          API_KEY: ${{ secrets.VISIONGUARD_API_KEY }}
          API_BASE_URL: https://l236050-a2-ops.vercel.app
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-network-proof
          path: cloud-smoke.json
