name: l236050_a2_ops
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    build: .
    image: l236050_a2_ops:optimized
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /models/champion.keras
      MODEL_VERSION: ${MODEL_VERSION:?Export the champion first}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:?Set MODEL_THRESHOLD}
      API_KEY: ${API_KEY:?Set API_KEY}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      REMOTE_INFERENCE_URL: ""
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-5242880}
    volumes:
      - ./model:/models:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  history_data:
